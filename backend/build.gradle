plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.3'
    id 'io.spring.dependency-management' version '1.1.3'
    id "org.sonarqube" version "4.3.1.3277"
    id 'jacoco'
    id 'org.flywaydb.flyway' version '7.10.0'

}

group = 'fontys'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation('org.springframework.boot:spring-boot-starter-validation')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    //testImplementation 'junit:junit:4.13.1'
//	implementation 'javax.validation:validation-api:2.0.1.Final'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    //developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

//	testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

//	testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'com.h2database:h2'
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

flyway {
    url = 'jdbc:mysql://localhost:3306/colorsickness'
    user = 'root'
    password = 'change-me-to-a-long-random-secret-of-at-least-32-bytes'
    locations = ['classpath:db/migration']
}

sonar {
    properties {
        property "sonar.projectKey", "ColorSickness"
        property "sonar.host.url", "http://localhost:9000/"
        property "sonar.token", "change-me-to-a-long-random-secret-of-at-least-32-bytes"
        property "sonar.scm.disabled", true
        property "sonar.qualitygate.wait", true
        property "sonar.sources", "src/main/java/fontys/individual/business/managers"
    }
}


tasks.named('test') {
//    useJUnitPlatform()
    finalizedBy jacocoTestReport
}
